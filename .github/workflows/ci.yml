name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serwer-mcp-nbp:
    name: serwer-mcp-nbp (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: serwer-mcp-nbp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints.txt -e '.[dev]'
      - name: Lint (ruff)
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Types (mypy --strict)
        run: .venv/bin/mypy
      - name: Tests (unit and e2e stdio, no network; live skipped)
        run: .venv/bin/pytest -q

  checkpoint-etap-2:
    name: checkpoint-etap-2 (pytest, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: checkpoint-etap-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalacja
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Testy panelu i bramki issue (bez sieci)
        run: .venv/bin/pytest -q
      - name: Typy (mypy)
        run: .venv/bin/mypy .

  agent-sdk-demo:
    name: agent-sdk-demo (ruff, mypy --strict, pytest; no Claude call)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-sdk-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Types (mypy --strict)
        run: .venv/bin/mypy --strict .
      - name: Tests (offline; live test skipped)
        run: .venv/bin/pytest -q
