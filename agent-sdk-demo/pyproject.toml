[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
ignore = ["D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
