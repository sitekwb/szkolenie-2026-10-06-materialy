[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nbp-mcp-server"
version = "2.0.0"
description = "MCP server (stdio) with NBP average exchange rates, Table A, read-only."
readme = "README.md"
license = "MIT"
authors = [{ name = "Wojciech Sitek" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.16",
    "mypy>=2.4",
]

[project.scripts]
nbp-mcp-server = "nbp_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nbp_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: test reaches the real api.nbp.pl (skipped by default, run: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "PT", "PL", "C4", "D"]
ignore = ["D203", "D213", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN401", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
